# ============================================
# Nginx Reverse Proxy — HTTP (default)
# ============================================
#
# This is the DEFAULT configuration and it works with no editing:
#
#   docker compose --profile production up -d
#   → http://localhost
#
# It serves the frontend and the API from a SINGLE origin on port 80:
#
#   /          → Next.js frontend (frontend:4321)
#   /api/...   → Express backend  (backend:8765)
#
# Because both share one origin, set this in your .env:
#
#   NEXT_PUBLIC_API_URL=http://localhost/api/v1        (or https://yourdomain.com/api/v1)
#   CORS_ORIGIN=http://localhost                       (or https://yourdomain.com)
#
# ── HTTPS ──────────────────────────────────────────────────────────────────
# TLS is intentionally OPT-IN. Most self-hosters already terminate TLS at their
# own proxy (Traefik, Caddy, Cloudflare, a cloud load balancer), and a container
# that demands certificates before it will start is hostile to that setup.
#
# To terminate TLS in THIS nginx instead, see ./tls.conf.example.
#
# ── Behind another reverse proxy? ──────────────────────────────────────────
# Don't use this service at all. Skip `--profile production` and point your
# proxy straight at the frontend and backend ports.
# ============================================

# Upstream for Backend API
upstream backend_api {
    least_conn;
    server backend:8765 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Upstream for Frontend
upstream frontend_app {
    least_conn;
    server frontend:4321 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Only send "Connection: upgrade" for actual WebSocket requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;

    # `_` matches any hostname, so this works on localhost, an IP, or any domain
    # with no edits. Replace with your domain if you want strict host matching.
    server_name _;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ============================================
    # Proxy health check (used by the compose healthcheck)
    # ============================================
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx healthy\n";
    }

    # ============================================
    # Backend API
    # ============================================
    # No trailing slash on proxy_pass: the full /api/v1/... path is forwarded
    # to the backend unchanged.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Longer timeouts for report/analytics queries
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    # ============================================
    # Next.js immutable assets
    # ============================================
    location /_next/static {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ============================================
    # Frontend (catch-all — keep last)
    # ============================================
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
