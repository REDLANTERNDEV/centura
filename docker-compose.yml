# ============================================
# Docker Compose Configuration
# Development & Production Ready
# ============================================

services:
  # ============================================
  # PostgreSQL Database Service
  # ============================================
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mini_saas_erp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8'
      PGDATA: /var/lib/postgresql/data/pgdata
      # Timezone ayarı - Tüm zamanlar UTC olarak saklanır
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize database schema on first run
      - ./apps/backend/scripts/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      # No ./backups mount needed: scripts/backup-db.sh pipes pg_dump's output to
      # the host through `docker compose exec`, so the dump never passes through
      # the container filesystem.
    # NOT published to the host on purpose. The backend reaches Postgres over the
    # internal `mini-saas-network` at postgres:5432, so nothing needs a host port,
    # and publishing 5432 on a public VPS exposes the database to the internet.
    #
    # For local database access use the dev overlay, which publishes it:
    #   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
    #
    # To reach the production database from your own machine, prefer an SSH tunnel:
    #   ssh -L 5432:localhost:5432 user@your-server
    # ...or bind to loopback only (safe from the internet, unlike a bare mapping):
    #   ports:
    #     - '127.0.0.1:${DB_PORT:-5432}:5432'
    networks:
      - mini-saas-network
    # PostgreSQL tuning for better performance
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=100'
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'effective_cache_size=1GB'
      - '-c'
      - 'maintenance_work_mem=64MB'
      - '-c'
      - 'checkpoint_completion_target=0.9'
      - '-c'
      - 'wal_buffers=16MB'
      - '-c'
      - 'default_statistics_target=100'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'effective_io_concurrency=200'
      - '-c'
      - 'work_mem=2621kB'
      - '-c'
      - 'min_wal_size=1GB'
      - '-c'
      - 'max_wal_size=4GB'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mini_saas_erp}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ============================================
  # Backend API Service
  # ============================================
  backend:
    build:
      context: . # Root context for workspace
      dockerfile: apps/backend/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Pinned to 8765 so the nginx upstream `backend:8765` stays valid; BACKEND_PORT
      # only selects the *host* port in the mapping below. Must stay set explicitly:
      # apps/backend/server.js falls back to 5000, not 8765, when PORT is absent.
      PORT: 8765
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mini_saas_erp}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4321}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4321}
    ports:
      - '${BACKEND_PORT:-8765}:8765'
    networks:
      - mini-saas-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(\"http\").get(\"http://localhost:$$PORT/api/v1/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on(\"error\", () => process.exit(1));"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ============================================
  # Frontend Service
  # ============================================
  frontend:
    build:
      context: . # Root context for workspace
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        # Compiled into the JS bundle at build time. Required, with no fallback:
        # a missing value would silently produce a bundle pointing at localhost,
        # which builds and deploys cleanly and then fails in every visitor's browser.
        # The dev overlay supplies a localhost default for local work.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env to the API URL the browser will call, e.g. https://example.com/api/v1}
        # Optional analytics, also compiled in at build time. An empty provider
        # (the default) means no tracking script is embedded at all — rebuild the
        # image after changing these, setting them at runtime has no effect.
        NEXT_PUBLIC_ANALYTICS_PROVIDER: ${NEXT_PUBLIC_ANALYTICS_PROVIDER:-}
        NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-}
        NEXT_PUBLIC_ANALYTICS_HOST: ${NEXT_PUBLIC_ANALYTICS_HOST:-}
        NEXT_PUBLIC_ANALYTICS_SRC: ${NEXT_PUBLIC_ANALYTICS_SRC:-}
        NEXT_PUBLIC_ANALYTICS_ATTRS: ${NEXT_PUBLIC_ANALYTICS_ATTRS:-}
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # NOTE: PORT is intentionally NOT set here. The container always listens on
      # 4321 (set by apps/frontend/Dockerfile), so the nginx upstream `frontend:4321`
      # stays valid. FRONTEND_PORT only chooses the *host* port in the mapping below.
      # For browser requests: the public API URL (see the build arg above)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env to the API URL the browser will call, e.g. https://example.com/api/v1}
      # For server-side requests in Next.js: use internal Docker hostname
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:${BACKEND_PORT:-8765}/api/v1}
    ports:
      - '${FRONTEND_PORT:-4321}:4321'
    networks:
      - mini-saas-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(\"http\").get(\"http://localhost:$$PORT/\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on(\"error\", () => process.exit(1));"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ============================================
  # Nginx Reverse Proxy (Optional for production)
  # ============================================
  nginx:
    image: nginx:alpine
    restart: always
    profiles:
      - production
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL certificates (if using HTTPS)
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - mini-saas-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      # Use 127.0.0.1, NOT localhost: nginx binds IPv4 only here (the image's
      # 10-listen-on-ipv6-by-default.sh can't patch our read-only conf.d mount),
      # while busybox wget resolves localhost to ::1 first and would always fail.
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Networks
# ============================================
networks:
  mini-saas-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
    name: mini-saas-postgres-data
